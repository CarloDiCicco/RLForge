[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlforge"
version = "0.1.0"
description = "Verifier-guided post-training for code models: generate → execute → classify → store → filter → train → evaluate."
requires-python = ">=3.11"

# Core runtime dependencies — always required for the Milestone 1 infrastructure.
dependencies = [
    "pydantic>=2.0",   # canonical-schema validation + JSON (de)serialization at adapter boundaries
    "pyyaml>=6.0",     # YAML config files (sandbox config, future run configs)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
data = [
    # Dataset preparation adapters (adapters/humaneval.py).
    "evalplus",   # HumanEval+ dataset access
    # adapters/livecodebench.py — raw dataset download (caches to
    # ~/.cache/huggingface/hub/, outside the repo, same convention as
    # evalplus's own ~/.cache/evalplus/ cache).
    "huggingface_hub>=0.20",
]
model = [
    # Local model inference (models/qwen.py). Loaded natively in bf16, no
    # quantization. torch is pinned and sourced from the CUDA 13.0 wheel index
    # below so `uv sync --extra model` installs the CUDA build (not the default
    # CPU wheel) and keeps it managed rather than pruning it on the next sync.
    "torch==2.12.1",
    "transformers>=4.40",
    "accelerate>=0.30",   # device_map="auto"
]

# Source torch from PyTorch's CUDA 13.0 wheel index; without this uv would
# resolve the default (CPU) wheel. Adjust to match the target CUDA toolkit.
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
