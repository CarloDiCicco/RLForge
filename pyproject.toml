[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlforge"
version = "0.1.0"
description = "Verifier-guided post-training for code models: generate → execute → classify → store → filter → train → evaluate."
requires-python = ">=3.11"

# Core runtime dependencies — always required for the Milestone 1 infrastructure.
dependencies = [
    "pydantic>=2.0",   # canonical-schema validation + JSON (de)serialization at adapter boundaries
    "pyyaml>=6.0",     # YAML config files (sandbox config, future run configs)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
data = [
    # Dataset preparation adapters (adapters/humaneval.py).
    "evalplus",   # HumanEval+ dataset access
    # adapters/livecodebench.py — raw dataset download (caches to
    # ~/.cache/huggingface/hub/, outside the repo, same convention as
    # evalplus's own ~/.cache/evalplus/ cache).
    "huggingface_hub>=0.20",
    # adapters/taco.py — TACO ships its data as parquet shards under ALL/ and a
    # custom loading script; we read the shards directly (streaming, since the
    # inline test payloads are far too large to materialize at once) rather than
    # going through datasets.load_dataset, same rationale as livecodebench.py.
    "pyarrow>=14",
]
model = [
    # Local model inference (models/qwen.py). Loaded natively in bf16, no
    # quantization. torch is pinned and sourced from the CUDA 13.0 wheel index
    # below so `uv sync --extra model` installs the CUDA build (not the default
    # CPU wheel) and keeps it managed rather than pruning it on the next sync.
    "torch==2.12.1",
    "transformers>=4.40",
    "accelerate>=0.30",   # device_map="auto"
]
train = [
    # RL post-training (GRPO). TRL is the trainer; peft supplies LoRA so a 4B
    # policy + reference + optimizer state fits alongside rollout generation on
    # a single GB10. torch stays pinned to the same 2.12.1+cu130 build the
    # baselines ran on — see the warning below about vllm.
    "trl>=1.13",
    "peft>=0.20",
    # Training-curve logging. Chosen over wandb deliberately: runs happen on the
    # DGX behind SSH, and tensorboard writes plain event files to the artifact
    # dir (no account, no network egress, survives a dropped connection).
    "tensorboard>=2.20",
]

# NOTE — do NOT add `vllm` to this project's environment without reading this.
# `uv pip install vllm` resolves to vllm 0.29.0, which requires torch 2.13.0
# from PyPI and would REPLACE the pinned torch==2.12.1+cu130 build that all
# three baselines (RESEARCH_LOG 2026-07-23/24) were produced on. Swapping the
# torch build under the baselines makes their numbers non-reproducible in this
# venv, which is exactly the comparison the RL results depend on. If vLLM-backed
# rollouts are wanted later, put them in a SEPARATE venv (server mode over HTTP),
# never in this one.

# Source torch from PyTorch's CUDA 13.0 wheel index; without this uv would
# resolve the default (CPU) wheel. Adjust to match the target CUDA toolkit.
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Tests that hit the network (dataset downloads). Deselect with -m "not slow".
    "slow: touches the network or is otherwise slow",
]
